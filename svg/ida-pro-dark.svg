      <tspan fill="#556070" dx="8">.text:00000000004AE650</tspan>
      <tspan fill="#c8d0dc" dx="14" font-weight="600">LDP</tspan>
      <tspan fill="#76b5c5" dx="18">W13, W14, [X1,#8]</tspan>
