      <tspan fill="#556070" dx="8">.text:00000000004AE640</tspan>
      <tspan fill="#c8d0dc" dx="14" font-weight="600">RET</tspan>
      <tspan fill="#76b5c5" dx="18">; CODE XREF: sub_4AE460+8</tspan>
    </text>
    <text x="18" y="102">
      <tspan fill="#00A0E9" font-size="9">●</tspan>
      <tspan fill="#556070" dx="8">.text:00000000004AE644</tspan>
