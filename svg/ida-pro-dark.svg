<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="260" viewBox="0 0 800 260" data-theme="dark">
  <defs>
    <!-- Card Border Clip -->
    <clipPath id="card-clip">
      <rect width="800" height="260" rx="8" />
    </clipPath>

    <!-- Subtle Static Drop Shadow for IDA Icon -->
    <filter id="ida-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00A0E9" flood-opacity="0.45" />
    </filter>

    <!-- Text Shadow for Contrast over Assembly -->
    <filter id="text-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Card Frame (Clipped with rx=8) -->
  <g clip-path="url(#card-clip)">
