    </g>

    <!-- 100% Mathematically Bounded Native SMIL DVD Bounce Animation (Zero Lag, Hardware Accelerated) -->
    <!-- X: 16 to 740 (Logo 44x44, card 800). Max right = 740 + 44 = 784 (16px margin) -->
    <!-- Y: 24 to 196 (Navbar 16px, card 260). Min Y = 24 (8px below navbar), Max Y = 196 + 44 = 240 (20px margin) -->
    <g id="dvd-bouncer">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="16 0; 740 0; 16 0" dur="13.7s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0 24; 0 196; 0 24" dur="8.1s" repeatCount="indefinite" />
      <image href="data:image/png;base64," width="44" height="44" opacity="0.65" filter="url(#ida-glow)" />
    </g>

    <!-- Pure Native SVG Bio Text (IDA Monospace, Never Glitches, Crystal Clear) -->
    <g font-family="Consolas, 'Liberation Mono', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="18.5" font-weight="500" fill="#3fa3eb" filter="url(#text-shadow)">
      <text x="36" y="92">I'm Platon, a low-level systems engineer and security researcher.</text>
      <text x="36" y="124">My work revolves around deconstructing complex software, reversing</text>
      <text x="36" y="156">obfuscated binaries, and probing bare-metal &amp; kernel mechanics</text>
      <text x="36" y="188">outside of intended constraints.<tspan fill="#3fa3eb" font-weight="300">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />|</tspan></text>
    </g>

    <!-- Authentic IDA Pro Navigation Bar (Memory Map) - Native SVG on Top Layer -->
    <g id="ida-navbar">
      <rect x="0" y="0" width="800" height="16" fill="#1e1e1e" />
      <rect x="0" y="0" width="38" height="16" fill="#00A0E9" />
      <rect x="38" y="0" width="144" height="16" fill="#C88E00" />
      <rect x="182" y="0" width="12" height="16" fill="#7A1F1D" />
      <rect x="194" y="0" width="48" height="16" fill="#857C42" />
      <rect x="242" y="0" width="256" height="16" fill="#C88E00" />
      <rect x="498" y="0" width="56" height="16" fill="#857C42" />
      <rect x="554" y="0" width="86" height="16" fill="#2D3139" />
      <rect x="640" y="0" width="40" height="16" fill="#C000C0" />
      <rect x="680" y="0" width="120" height="16" fill="#00A859" />
      <!-- Golden Cursor Position Indicator -->
      <rect x="360" y="0" width="22" height="16" fill="rgba(255, 215, 0, 0.3)" stroke="#FFD700" stroke-width="1.5" />
      <line x1="0" y1="16" x2="800" y2="16" stroke="#000000" stroke-width="1.5" />
    </g>
  </g>
</svg>