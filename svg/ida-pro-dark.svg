      <tspan fill="#c8d0dc" dx="14" font-weight="600">LDP</tspan>
      <tspan fill="#76b5c5" dx="18">W8, W12, [X0]</tspan>
    </text>
    <text x="18" y="150">
      <tspan fill="#00A0E9" font-size="9">●</tspan>
      <tspan fill="#556070" dx="8">.text:00000000004AE648</tspan>
      <tspan fill="#c8d0dc" dx="14" font-weight="600">LDP</tspan>
