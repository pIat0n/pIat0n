<svg xmlns="http://www.w3.org/2000/svg" fill="none" height="20" width="100%" data-theme="light">
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">
            <style>
    :root {
        --color-text: #0969DA;
        --color-sub: #57606A;
        --color-dot-bg-0: #EBEDF0;
        --color-dot-bg-1: #A7BEFB;
        --color-dot-bg-2: #628BF9;
        --color-dot-bg-3: #4071F7;
        --color-dot-bg-4: #255DF6;
        --color-hud-bg: rgba(246, 248, 250, 0.85);
        --color-hud-border: rgba(209, 217, 224, 0.8);

        --animate-in-menu-delay: 0.05s;
        --animate-in-links-delay: 0.1s;
        --animate-in-copy-delay: 0.25s;
        --animate-in-hud-delay: 1.5s;
    }

    *, *::before, *::after {
        box-sizing: border-box;
    }

    .wrapper {
        position: relative;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        color: var(--color-text);
        width: 100%;
        height: 100%;
    }

    .fade-in {
        animation: fade-in 0.6s ease-out both;
        animation-delay: var(--delay, 0s);
    }

    @keyframes fade-in {
        0% { opacity: 0; transform: translateY(2px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    .shine {
        background-color: var(--color-text);
        background-image: linear-gradient(-75deg,
            rgba(255, 255, 255, 0) 0%,
            rgba(255, 255, 255, 0.4) 15%,
            rgba(255, 255, 255, 0) 25%
        );
        background-size: 200%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 12s infinite;
    }

    @keyframes shine {
        0% { background-position: 200%; }
        10% { background-position: 0%; }
        100% { background-position: 0%; }
    }
    
    .top-container {{
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 20px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
        position: relative;
    }}
    .status-badge {{
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
    }}
    .status-dot {{
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: #2EA043;
        box-shadow: 0 0 8px #2EA043;
        animation: pulse-dot 2s ease-in-out infinite;
    }}
    @keyframes pulse-dot {{
        0%, 100% {{ opacity: 1; transform: scale(1); }}
        50% {{ opacity: 0.4; transform: scale(0.85); }}
    }}
    .gradient-border {{
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
            90deg,
            var(--color-dot-bg-1),
            var(--color-dot-bg-2),
            var(--color-dot-bg-3),
            var(--color-dot-bg-4),
            var(--color-dot-bg-3),
            var(--color-dot-bg-1)
        );
        background-size: 200% 100%;
        animation: gradient-flow 6s linear infinite;
    }}
    @keyframes gradient-flow {{
        0% {{ background-position: 0% 50%; }}
        100% {{ background-position: 200% 50%; }}
    }}
    </style>
            <div class="wrapper">
                <div class="top-container">
                    <div class="status-badge fade-in" style="--delay: 0.1s;">
                        <span class="status-dot"></span>
                        <span class="shine">pIat0n</span>
                    </div>
                    <div class="fade-in" style="--delay: 0.25s; font-size: 11px; color: var(--color-sub); font-family: ui-monospace, monospace;">
                        RING-0 • BARE-METAL • REVERSING
                    </div>
                    <div class="fade-in" style="--delay: 0.35s; font-size: 11px; color: var(--color-sub); font-family: ui-monospace, monospace;">
                        README.md
                    </div>
                    <div class="gradient-border"></div>
                </div>
            </div>
        </div>
    </foreignObject>
</svg>