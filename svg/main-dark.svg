                        <div class="hud-box fade-in" style="--delay: var(--animate-in-hud-delay);">
                            <div class="hud-row">
                                <span class="hud-tag">STACK</span>
                                <span class="hud-desc">ASM (x86/ARM) • C/C++ • Python • Rust • IDA Pro • Frida • GDB</span>
                            </div>
                            <div class="hud-row">
                                <span class="hud-tag">SYSTEMS</span>
                                <span class="hud-desc">Bare-Metal Bootloaders • Linux Kernel • Android Internals • Ring -2 (SMM)</span>
