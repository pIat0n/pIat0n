<svg xmlns="http://www.w3.org/2000/svg" fill="none" height="350" width="100%" data-theme="dark">
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">
            <style>
    :root {
        --color-text: #58A6FF;
        --color-sub: #8B949E;
        --color-dot-bg-0: #161B22;
        --color-dot-bg-1: #1F6FEB;
        --color-dot-bg-2: #238636;
        --color-dot-bg-3: #388BFD;
        --color-dot-bg-4: #2EA043;
        --color-hud-bg: rgba(22, 27, 34, 0.85);
        --color-hud-border: rgba(48, 54, 61, 0.8);

        --animate-in-menu-delay: 0.05s;
        --animate-in-links-delay: 0.1s;
        --animate-in-copy-delay: 0.25s;
        --animate-in-hud-delay: 1.5s;
    }

    *, *::before, *::after {
        box-sizing: border-box;
    }

    .wrapper {
        position: relative;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        color: var(--color-text);
        width: 100%;
        height: 100%;
    }

    .fade-in {
        animation: fade-in 0.6s ease-out both;
        animation-delay: var(--delay, 0s);
    }

    @keyframes fade-in {
        0% { opacity: 0; transform: translateY(2px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    .shine {
        background-color: var(--color-text);
        background-image: linear-gradient(-75deg,
            rgba(255, 255, 255, 0) 0%,
            rgba(255, 255, 255, 0.4) 15%,
            rgba(255, 255, 255, 0) 25%
        );
        background-size: 200%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 12s infinite;
    }

    @keyframes shine {
        0% { background-position: 200%; }
        10% { background-position: 0%; }
        100% { background-position: 0%; }
    }
    
    .main-box {
        position: relative;
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 350px;
        box-sizing: border-box;
    }
    
    .blobs {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
    }
    .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(55px);
        opacity: 0.14;
        will-change: transform;
    }
    .blob--1 {
        width: 260px;
        height: 260px;
        background: var(--color-dot-bg-1);
        top: -40px;
        right: -30px;
        animation: morph-1 18s ease-in-out infinite;
    }
    .blob--2 {
        width: 200px;
        height: 200px;
        background: var(--color-dot-bg-4);
        bottom: -20px;
        left: -30px;
        animation: morph-2 22s ease-in-out infinite;
    }
    .blob--3 {
        width: 160px;
        height: 160px;
        background: var(--color-dot-bg-3);
        top: 35%;
        left: 45%;
        animation: morph-3 16s ease-in-out infinite;
    }
    @keyframes morph-1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(-30px, 20px) scale(1.08); }
        66% { transform: translate(15px, -15px) scale(0.92); }
    }
    @keyframes morph-2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(30px, -15px) scale(1.1); }
        66% { transform: translate(-20px, 10px) scale(0.9); }
    }
    @keyframes morph-3 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(-20px, 25px) scale(1.15); }
        66% { transform: translate(25px, -20px) scale(0.85); }
    }

    .graph__parallax {
        position: absolute;
        inset: 0;
        opacity: 0.12;
        background-image: radial-gradient(circle, var(--color-dot-bg-1) 1.2px, transparent 1.2px);
        background-size: 28px 28px;
        animation: parallax 70s linear infinite;
        pointer-events: none;
        z-index: 0;
    }
    @keyframes parallax {
        0% { background-position: 0 0; }
        100% { background-position: -560px 0; }
    }

    .content-area {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 100%;
    }

    .intro-paragraph {
        font-size: 20px;
        line-height: 1.5;
        font-weight: 350;
        letter-spacing: -0.015em;
        margin: 0;
    }
    .intro-paragraph span.char {
        opacity: 0;
        animation: typewriter-char 0s forwards;
        animation-delay: calc(var(--animate-in-copy-delay) + var(--i) * 16ms);
    }
    .cursor {
        font-weight: 300;
        color: var(--color-text);
        opacity: 0;
        animation: blink-cursor 1s step-end infinite, typewriter-char 0s forwards;
        animation-delay: calc(var(--animate-in-copy-delay) + var(--total-chars) * 16ms);
    }
    @keyframes typewriter-char {
        to { opacity: 1; }
    }
    @keyframes blink-cursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
        .intro-paragraph span.char, .cursor {
            opacity: 1 !important;
            animation: none !important;
        }
    }

    .hud-box {
        background: var(--color-hud-bg);
        border: 1px solid var(--color-hud-border);
        border-radius: 8px;
        padding: 14px 16px;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }
    .hud-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 6px;
    }
    .hud-row:last-child {
        margin-bottom: 0;
    }
    .hud-tag {
        color: var(--color-text);
        font-weight: 600;
        letter-spacing: 0.05em;
        min-width: 65px;
        font-size: 11px;
    }
    .hud-desc {
        color: var(--color-sub);
    }
    </style>
            <div class="wrapper">
                <div class="main-box">
                    <div class="blobs">
                        <div class="blob blob--1"></div>
                        <div class="blob blob--2"></div>
                        <div class="blob blob--3"></div>
                    </div>
                    <div class="graph__parallax"></div>
                    
                    <div class="content-area">
                        <article class="intro-paragraph">
